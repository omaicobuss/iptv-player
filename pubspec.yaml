name: iptv_player
description: "Aplicativo IPTV Player para listas M3U."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  hive_ce: ^2.20.2
  dio: ^5.7.0
  file_picker: ^10.2.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  xml: ^6.5.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
