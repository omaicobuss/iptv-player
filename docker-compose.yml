services:
  flutter-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: iptv_flutter_dev
    volumes:
      - .:/workspace
      - flutter_cache:/root/.pub-cache
      - gradle_cache:/root/.gradle
    environment:
      DISPLAY: ${DISPLAY:-}
    network_mode: host
    stdin_open: true
    tty: true

volumes:
  flutter_cache:
  gradle_cache:
